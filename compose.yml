# Trackmania 2020 dedicated server (+ PitWall controller, optional).
#
#   cp .env.example .env      # then fill in the credentials (never commit .env)
#   docker compose up -d trackmania
#   cargo run                 # controller on the host, connects to 127.0.0.1:5000
#
# Everything in Docker (e.g. on the Debian box):
#   docker compose --profile controller up -d --build
#
# Image documentation: https://github.com/EvoTM/docker-trackmania

services:
  trackmania:
    image: evoesports/trackmania:latest
    restart: unless-stopped
    ports:
      # Game port: open/forward TCP+UDP 2350 on your router for online players.
      - "2350:2350/tcp"
      - "2350:2350/udp"
      # XML-RPC: bound to localhost only, for a controller running on the host.
      - "${TM_XMLRPC_BIND:-127.0.0.1}:${TM_XMLRPC_PORT:-5000}:5000/tcp"
    environment:
      # Dedicated server account: https://players.trackmania.com/server/dedicated
      # Without it, the server starts in LAN mode.
      TM_MASTERSERVER_LOGIN: ${TM_MASTERSERVER_LOGIN:?set TM_MASTERSERVER_LOGIN in .env}
      TM_MASTERSERVER_PASSWORD: ${TM_MASTERSERVER_PASSWORD:?set TM_MASTERSERVER_PASSWORD in .env}
      # XML-RPC SuperAdmin password; PitWall uses the same value.
      TM_AUTHORIZATION_SUPERADMIN_PASSWORD: ${TM_AUTHORIZATION_SUPERADMIN_PASSWORD:?set TM_AUTHORIZATION_SUPERADMIN_PASSWORD in .env}
      TM_AUTHORIZATION_ADMIN_PASSWORD: ${TM_AUTHORIZATION_ADMIN_PASSWORD:?set TM_AUTHORIZATION_ADMIN_PASSWORD in .env}
      TM_AUTHORIZATION_USER_PASSWORD: ${TM_AUTHORIZATION_USER_PASSWORD:?set TM_AUTHORIZATION_USER_PASSWORD in .env}
      TM_SERVER_NAME: ${TM_SERVER_NAME:-PitWall test server}
      TM_SERVER_COMMENT: ${TM_SERVER_COMMENT:-}
      TM_SERVER_PASSWORD: ${TM_SERVER_PASSWORD:-}
      TM_SERVER_MAX_PLAYERS: ${TM_SERVER_MAX_PLAYERS:-16}
      TM_SERVER_MAX_SPECTATORS: ${TM_SERVER_MAX_SPECTATORS:-16}
      # Keep points/slot when a player switches to spectator (useful in cups).
      TM_SERVER_KEEP_PLAYER_SLOTS: "True"
      # Accept XML-RPC from outside the container (the host or the controller container).
      TM_SYSTEM_XMLRPC_ALLOWREMOTE: "True"
      # Public address announced to players, e.g. 203.0.113.10:2350 (empty = automatic).
      TM_SYSTEM_FORCE_IP_ADDRESS: ${TM_SYSTEM_FORCE_IP_ADDRESS:-}
    volumes:
      - tm-userdata:/server/UserData

  pitwall:
    profiles: ["controller"]
    build: .
    restart: unless-stopped
    depends_on:
      - trackmania
    stdin_open: true   # `docker attach` gives the console
    tty: true
    environment:
      PITWALL_SERVER__HOST: trackmania
      PITWALL_SERVER__PORT: "5000"
      PITWALL_SERVER__PASSWORD: ${TM_AUTHORIZATION_SUPERADMIN_PASSWORD:?set TM_AUTHORIZATION_SUPERADMIN_PASSWORD in .env}
      PITWALL_SERVER__MAPS_PATH: /tm-userdata/Maps
      PITWALL_CONTROLLER__DATA_DIR: /data
      PITWALL_API__BIND: 0.0.0.0:8080
      PITWALL_API__ADMIN_TOKEN: ${PITWALL_API__ADMIN_TOKEN:-}
      PITWALL_NADEO__LOGIN: ${TM_MASTERSERVER_LOGIN:-}
      PITWALL_NADEO__PASSWORD: ${TM_MASTERSERVER_PASSWORD:-}
      PITWALL_TRACKMANIA_API__CLIENT_ID: ${PITWALL_TRACKMANIA_API__CLIENT_ID:-}
      PITWALL_TRACKMANIA_API__CLIENT_SECRET: ${PITWALL_TRACKMANIA_API__CLIENT_SECRET:-}
      PITWALL_DISCORD__WEBHOOK_URL: ${PITWALL_DISCORD__WEBHOOK_URL:-}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./pitwall.toml:/app/pitwall.toml:ro
      - ./config:/app/config:ro
      - pitwall-data:/data
      - tm-userdata:/tm-userdata

volumes:
  tm-userdata:
  pitwall-data:
