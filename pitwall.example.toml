# PitWall configuration. Copy to pitwall.toml and adapt.
# Every value can be overridden by an environment variable: PITWALL_<SECTION>__<KEY>,
# e.g. PITWALL_SERVER__PASSWORD, PITWALL_SERVER__HOST.
# Secrets (passwords, tokens) go in the environment or in .env — never in this file.

[server]
host = "127.0.0.1"
port = 5000                 # XML-RPC port of the dedicated server
user = "SuperAdmin"
# password = "..."          # → set PITWALL_SERVER__PASSWORD instead
api_version = "2023-03-25"
call_timeout_secs = 10
reconnect_delay_secs = 2
max_reconnect_delay_secs = 30
matchsettings_dir = "MatchSettings/PitWall"
# Startup MatchSettings of the server (TM_GAME_SETTINGS in Docker): playlist and mode are
# saved there after each change so a server restart keeps them. "" = never saved.
playlist_file = "MatchSettings/default.txt"
# Server's Maps directory when PitWall can write it (shared volume, e.g. Docker): maps of any
# size are written there directly. "" = upload with WriteFile (maps up to about 3 MB).
maps_path = ""

[controller]
default_lang = "fr"         # fr | en
announce_joins = true
formats_dir = "config/formats"
cups_dir = "config/cups"
maps_dir = "config/maps"     # local .Map.Gbx files for /map local
data_dir = "data"
console = true              # read commands on stdin (type `help`)
# Formats offered in /mode, /formats, the admin panel and the dashboard ([] = all of them).
formats = ["timeattack", "rounds"]
cups = false                # /cup, /join, /ready, cup banner and cup pages of the dashboard

[roles]
# Trackmania logins (the short id shown on trackmania.io, not the display name).
superadmins = []
admins = []
referees = []
casters = []
# Trackmania club ids (trackmania.io/#/clubs/<id>) whose members are admins, refreshed every
# 5 minutes from the Nadeo API (needs PITWALL_NADEO__LOGIN / PITWALL_NADEO__PASSWORD).
admin_clubs = []

[api]
enabled = true
bind = "127.0.0.1:8080"     # web dashboard; keep on localhost behind a reverse proxy
# admin_token = "..."       # → set PITWALL_API__ADMIN_TOKEN instead
public_url = ""             # e.g. https://cup.example.org (registration links)

[nadeo]
# Dedicated server account, for /map uid and /map club:
# PITWALL_NADEO__LOGIN / PITWALL_NADEO__PASSWORD
# Also enables the world records widget (world top 5 and each player's world position).

[trackmania_api]
# OAuth application (api.trackmania.com/manager, Confidential) for the world record names:
# PITWALL_TRACKMANIA_API__CLIENT_ID / PITWALL_TRACKMANIA_API__CLIENT_SECRET

[discord]
# webhook_url = "..."       # → set PITWALL_DISCORD__WEBHOOK_URL instead
username = "PitWall"

[recording]
# Raw GbxRemote traffic, to turn a bug seen on the server into a test
# (docs/ENREGISTREMENT.fr.md). Passwords are masked. Off by default.
enabled = false
dir = ""                    # "" = <data_dir>/recordings
max_file_mb = 20            # a new file starts past this size
max_files = 10              # the newest files are kept

[log]
filter = "info"             # e.g. "info,pitwall::events=debug"; RUST_LOG overrides it
format = "pretty"           # pretty | json

[plugins.logger]
skip = ["checkpoint", "callback"]

# In-game widgets: theme and positions (x ∈ [-160, 160], y ∈ [-90, 90], top-left corner).
[plugins.ui.theme]
accent = "0af"
background = "111"
background_opacity = 0.75

[plugins.ui.layout]
max_rows = 12
# positions = { ranking = { x = 116.0, y = 62.0 }, world_records = { x = -160.0, y = 62.0 }, records = { x = -160.0, y = 26.0 } }

[plugins.maps]
# true: every player may add maps (/map add|tmx|uid|search); the rest stays for admins.
players_can_add = false

[plugins.votes]
# /skip and /res: player votes to skip or restart the map.
enabled = true
duration_s = 30
ratio = 0.5
cooldown_s = 60
