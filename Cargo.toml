[workspace]
resolver = "3"
members = ["crates/*", "plugins/*"]
default-members = ["crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/MaKSiiMe/PitWall"
publish = false

[workspace.dependencies]
# Internal crates
pitwall-gbx = { path = "crates/gbx" }
pitwall-core = { path = "crates/core" }
pitwall-formats = { path = "crates/formats" }
pitwall-ui = { path = "crates/ui" }
pitwall-api = { path = "crates/api" }
pitwall-storage = { path = "crates/storage" }
pitwall-integrations = { path = "crates/integrations" }
pitwall-plugin-logger = { path = "plugins/logger" }
pitwall-plugin-formats = { path = "plugins/formats" }
pitwall-plugin-admin = { path = "plugins/admin" }
pitwall-plugin-cup = { path = "plugins/cup" }
pitwall-plugin-ui = { path = "plugins/ui" }
pitwall-plugin-storage = { path = "plugins/storage" }
pitwall-plugin-maps = { path = "plugins/maps" }
pitwall-plugin-discord = { path = "plugins/discord" }
pitwall-plugin-worldrecords = { path = "plugins/worldrecords" }

# Async runtime
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "net", "io-util", "io-std", "sync", "time", "signal"] }

tokio-util = { version = "0.7", features = ["codec", "rt"] }
bytes = "1.12"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
quick-xml = "0.42"
toml = "1.1"
askama = "0.16"
axum = { version = "0.8", features = ["ws"] }
getrandom = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query", "form", "http2", "charset"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros", "json"] }
mlua = { version = "0.12", features = ["lua54", "vendored", "send", "serde"] }
base64 = "0.23"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Errors, logs, config
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
figment = { version = "0.10", features = ["toml", "env"] }
dotenvy = "0.15"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# No unwrap/expect outside tests (tests are allowed via clippy.toml).
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
