[cup]
registration_open = "$0afRegistrations are open for $fff{cup}$0af! Type $fff/join$0af."
registered = "$0f0{name}$z$s$0f0 is registered."
pending = "$ff0{name}$z$s$ff0 asked to join; waiting for an admin."
started = "$0af$o{cup}$z$s$0af starts with $fff{count}$0af participants!"
phase_next = "$0afNext phase: $fff{phase}$0af ({count} participants)."
match_next = "$0afNext match: $fff{a}$z$s$0af vs $fff{b}"
waiting_admin = "$aaaWaiting for an admin to start."
ready_check = "$ff0Ready check! Type $fff/ready$ff0 or click READY ({seconds} s)."
ready_progress = "$aaaReady: $fff{ready}/{total}"
ready_timeout = "$ff0Ready time is over, starting now."
starting_in = "$aaaStarting in {seconds} s."
phase_start = "$0af$oGo! {phase}"
match_won = "$0f0{winner}$z$s$0f0 wins the match!"
phase_results = "$0afResults of {phase}:"
result_line = "$fff{rank}. {name}$z$s $aaa{points}"
rules_message = "$0af{text}"
finished = "$0af$o{cup}$z$s$0af is over. Congratulations!"
podium = "$fc0{rank}. $fff{name}"
eliminated = "$f80You are eliminated. Thanks for playing!"
qualified = "$aaa{count} qualified for the next phase."
paused = "$ff0Technical pause."
resumed = "$0f0Resuming!"
paused_disconnect = "$ff0{name}$z$s$ff0 disconnected: pause (max {seconds} s)."
disconnected_grace = "$ff0{name}$z$s$ff0 disconnected: {seconds} s to come back."
disqualified = "$f44{name}$z$s$f44 is disqualified."
aborted = "$f44The cup has been cancelled."
no_cup = "$f80No cup loaded. Use $fff/cup load <id>$f80."
loaded = "$0f0Cup loaded: $fff{cup}"
unknown = "$f80Unknown cup $fff{id}$f80. Type $fff/cup list$f80."
error = "$f44Cup: {message}"
status = "$fff{cup}$z$s $aaa— {status} {phase}"
list_header = "$fffCups:"
list_entry = "$0af{id}$fff — {name} $888({phases} phases)"
format_failed = "$f44Could not load the phase format: {message}. Use $fff/cup retry$f44."
participant = "$fff{name}$z$s $888{id} {status}"

[cup.cmd]
cup = "Run a cup: list, load, open, start, go, pause, resume, advance, winner, retry, dq, reinstate, add, remove, approve, status, abort, unload"
join = "Register for the cup"
leave = "Unregister from the cup"
ready = "Say you are ready"
