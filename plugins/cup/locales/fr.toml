[cup]
registration_open = "$0afLes inscriptions sont ouvertes pour $fff{cup}$0af ! Tape $fff/join$0af."
registered = "$0f0{name}$z$s$0f0 est inscrit."
pending = "$ff0{name}$z$s$ff0 demande à participer ; en attente d'un admin."
started = "$0af$o{cup}$z$s$0af commence avec $fff{count}$0af participants !"
phase_next = "$0afPhase suivante : $fff{phase}$0af ({count} participants)."
match_next = "$0afProchain match : $fff{a}$z$s$0af contre $fff{b}"
waiting_admin = "$aaaEn attente du lancement par un admin."
ready_check = "$ff0Appel ! Tape $fff/ready$ff0 ou clique sur PRÊT ({seconds} s)."
ready_progress = "$aaaPrêts : $fff{ready}/{total}"
ready_timeout = "$ff0Temps écoulé, on lance."
starting_in = "$aaaDépart dans {seconds} s."
phase_start = "$0af$oC'est parti ! {phase}"
match_won = "$0f0{winner}$z$s$0f0 remporte le match !"
phase_results = "$0afRésultats de {phase} :"
result_line = "$fff{rank}. {name}$z$s $aaa{points}"
rules_message = "$0af{text}"
finished = "$0af$o{cup}$z$s$0af est terminée. Bravo !"
podium = "$fc0{rank}. $fff{name}"
eliminated = "$f80Tu es éliminé. Merci d'avoir joué !"
qualified = "$aaa{count} qualifiés pour la phase suivante."
paused = "$ff0Pause technique."
resumed = "$0f0On reprend !"
paused_disconnect = "$ff0{name}$z$s$ff0 s'est déconnecté : pause (max {seconds} s)."
disconnected_grace = "$ff0{name}$z$s$ff0 s'est déconnecté : {seconds} s pour revenir."
disqualified = "$f44{name}$z$s$f44 est disqualifié."
aborted = "$f44La cup est annulée."
no_cup = "$f80Aucune cup chargée. Utilise $fff/cup load <id>$f80."
loaded = "$0f0Cup chargée : $fff{cup}"
unknown = "$f80Cup inconnue $fff{id}$f80. Tape $fff/cup list$f80."
error = "$f44Cup : {message}"
status = "$fff{cup}$z$s $aaa— {status} {phase}"
list_header = "$fffCups :"
list_entry = "$0af{id}$fff — {name} $888({phases} phases)"
format_failed = "$f44Impossible de charger le format de la phase : {message}. Utilise $fff/cup retry$f44."
participant = "$fff{name}$z$s $888{id} {status}"

[cup.cmd]
cup = "Pilote une cup : list, load, open, start, go, pause, resume, advance, winner, retry, dq, reinstate, add, remove, approve, status, abort, unload"
join = "S'inscrire à la cup"
leave = "Se désinscrire de la cup"
ready = "Indiquer que tu es prêt"
