[admin]
kicked = "$fff{admin}$z$s$f80 a expulsé $fff{player}$z$s$f80. {reason}"
banned = "$fff{admin}$z$s$f44 a banni $fff{player}$z$s$f44. {reason}"
muted = "$fff{player}$z$s$f80 est réduit au silence."
unmuted = "$fff{player}$z$s$0f0 peut de nouveau parler."
paused = "$ff0Pause technique."
resumed = "$0f0On reprend !"
restarting = "$fffRedémarrage de la map…"
skipping = "$fffMap suivante…"
round_ended = "$fffManche terminée par un arbitre."
warmup_stopped = "$fffÉchauffement arrêté."
points_set = "$0f0Points de {target} mis à jour."
player_not_found = "$f80Aucun joueur ne correspond à $fff{query}$f80."
player_ambiguous = "$f80Plusieurs joueurs correspondent : $fff{logins}"
bot_connected = "$0f0Bot connecté : {login}"
announce = "$ff0{text}"

[admin.cmd]
