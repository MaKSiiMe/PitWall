[admin]
kicked = "$fff{admin}$z$s$f80 kicked $fff{player}$z$s$f80. {reason}"
banned = "$fff{admin}$z$s$f44 banned $fff{player}$z$s$f44. {reason}"
muted = "$fff{player}$z$s$f80 is muted."
unmuted = "$fff{player}$z$s$0f0 can talk again."
paused = "$ff0Technical pause."
resumed = "$0f0Resuming!"
restarting = "$fffRestarting the map…"
skipping = "$fffNext map…"
round_ended = "$fffRound ended by a referee."
warmup_stopped = "$fffWarm-up stopped."
points_set = "$0f0Points of {target} updated."
player_not_found = "$f80No player matches $fff{query}$f80."
player_ambiguous = "$f80Several players match: $fff{logins}"
bot_connected = "$0f0Bot connected: {login}"
announce = "$ff0{text}"
time_added = "$fff{admin}$z$s$0f0 added $fff{minutes} min$0f0 to the map."
addtime_not_ta = "$f80Adding time only works in Time Attack."
addtime_no_limit = "$f80This map has no time limit."

[admin.cmd]
kick = "Kick a player"
ban = "Ban a player until the server restarts"
blacklist = "Ban and blacklist a player"
unban = "Unban a player"
mute = "Mute a player in the chat"
unmute = "Unmute a player"
spec = "Force a player to spectate"
play = "Force a player to race"
free = "Let a player choose to race or spectate"
team = "Put a player in a team"
restart = "Restart the current map"
addtime = "Add time to the Time Attack map (5 min by default)"
next = "Go to the next map"
endround = "End the current round"
pause = "Start a technical pause"
resume = "End the technical pause"
endwarmup = "Stop the warm-up"
points = "Correct a player's points"
teampoints = "Correct a team's points"
guest = "Manage the guest list"
password = "Set or remove the server password"
bot = "Connect a test bot (or remove them all)"
say = "Announce something to everyone"
