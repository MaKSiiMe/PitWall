<!doctype html>
<html lang="{{ t.lang() }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}PitWall{% endblock %}</title>
<script src="/static/htmx.min.js"></script>
<style>
:root { --bg:#0e0f12; --panel:#17191e; --line:#262a31; --text:#e8eaed; --muted:#8a919c; --accent:#00aaff; --good:#3fb950; --bad:#f85149; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display:flex; align-items:center; gap:24px; padding:12px 24px; background:var(--panel); border-bottom:2px solid var(--accent); }
header .brand { font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
header .brand span { color:var(--accent); }
nav { display:flex; gap:16px; flex:1; }
nav a, .lang a { color:var(--muted); text-decoration:none; font-weight:600; }
nav a:hover, .lang a:hover { color:var(--text); }
.lang { display:flex; gap:8px; font-size:13px; }
main { max-width:1100px; margin:0 auto; padding:24px; display:grid; gap:20px; }
.grid { display:grid; gap:20px; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); }
.card { background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:6px; padding:16px 20px; }
.card h2 { margin:0 0 12px; font-size:13px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
table { width:100%; border-collapse:collapse; }
th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
th { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.06em; }
td.num { font-variant-numeric:tabular-nums; text-align:right; }
.muted { color:var(--muted); }
.pill { display:inline-block; padding:2px 10px; border-radius:99px; background:var(--line); font-size:12px; font-weight:700; }
.pill.live { background:var(--accent); color:#000; }
.pill.ok { background:var(--good); color:#000; }
.pill.bad { background:var(--bad); color:#000; }
button, .btn { background:var(--line); color:var(--text); border:1px solid #333; border-radius:4px; padding:5px 12px; font-weight:600; cursor:pointer; text-decoration:none; font-size:13px; }
button:hover, .btn:hover { border-color:var(--accent); }
button.primary, .btn.primary { background:var(--accent); color:#000; border-color:var(--accent); }
button.danger { color:var(--bad); }
input, select { background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:4px; padding:7px 10px; font:inherit; width:100%; }
label { display:grid; gap:4px; margin-bottom:12px; font-weight:600; font-size:13px; }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
pre.console { background:#000; color:#9fe; padding:12px; border-radius:4px; min-height:60px; white-space:pre-wrap; margin:12px 0 0; }
.msg { padding:10px 14px; border-radius:4px; background:var(--line); }
.msg.ok { border-left:3px solid var(--good); } .msg.bad { border-left:3px solid var(--bad); }
.cut td { border-bottom:2px solid var(--bad); }
.htmx-request { opacity:.6; transition:opacity .2s; }
</style>
</head>
<body>
<header>
  <div class="brand">Pit<span>Wall</span></div>
  <nav>
    <a href="/">{{ t.get("web.nav_home") }}</a>
    <a href="/cup">{{ t.get("web.nav_cup") }}</a>
    <a href="/history">{{ t.get("web.nav_history") }}</a>
    <a href="/register">{{ t.get("web.nav_register") }}</a>
    <a href="/admin">{{ t.get("web.nav_admin") }}</a>
  </nav>
  <div class="lang"><a href="/lang/fr">FR</a><a href="/lang/en">EN</a></div>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
