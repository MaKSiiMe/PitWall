{% extends "base.html" %}
{% block content %}
<section class="card" style="max-width:420px">
  <h2>{{ t.get("web.login_title") }}</h2>
  {% if !enabled %}<p class="msg bad">{{ t.get("web.admin_disabled") }}</p>{% else %}
  {% if failed %}<p class="msg bad">{{ t.get("web.bad_token") }}</p>{% endif %}
  <form method="post" action="/admin/login">
    <label>{{ t.get("web.token") }}<input type="password" name="token" required autocomplete="current-password"></label>
    <button class="primary" type="submit">{{ t.get("web.login") }}</button>
  </form>
  {% endif %}
</section>
{% endblock %}
