name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/maksiime/pitwall

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  # Pushes to main: publish the image, then the stack pinned to it on the `deploy` branch, which
  # Portainer polls. Put "[skip deploy]" in the commit message to leave the server alone.
  release:
    needs: check
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && !contains(github.event.head_commit.message, '[skip deploy]')
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: true
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish the stack on the deploy branch
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          stack="$RUNNER_TEMP/stack.yml"
          sed "s|$IMAGE:latest|$IMAGE:$TAG|" deploy/portainer/stack.yml > "$stack"
          grep -q "$IMAGE:$TAG" "$stack"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin deploy; then
            git checkout -B deploy FETCH_HEAD
          else
            git checkout --orphan deploy
            git rm -rfq .
          fi
          cp "$stack" stack.yml
          git add stack.yml
          if git diff --cached --quiet; then exit 0; fi   # re-run of the same commit
          git commit -m "deploy ${GITHUB_SHA::7}: ${{ github.event.head_commit.url }}"
          git push origin deploy
