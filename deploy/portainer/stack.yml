# Trackmania 2020 dedicated server + PitWall — Portainer stack deployed from Git (GitOps).
#
# Portainer does not read this file from `main` but from the `deploy` branch, where the CI writes
# it once the PitWall image of the commit is published, with `:latest` replaced by `:sha-<commit>`.
# A push to main therefore redeploys PitWall only when its image exists.
#
# Secrets are NOT in this file: fill them in Portainer's "Environment variables" section
# (see deploy/portainer/stack.env.example). Setup: docs/GUIDE.fr.md, "Déploiement automatique".

services:
  trackmania:
    # Pinned version; .github/workflows/trackmania-image.yml opens a PR when Evo publishes a
    # newer one. Image docs: https://github.com/EvoTM/docker-trackmania
    image: evoesports/trackmania:2026-05-16
    container_name: trackmania
    restart: unless-stopped
    ports:
      # Game port, must be reachable by players (router port forwarding TCP + UDP 2350).
      - "2350:2350/tcp"
      - "2350:2350/udp"
      # XML-RPC: PitWall reaches it through the stack network. Publish it on a private address
      # only (Tailscale IP or 127.0.0.1) to run a development controller from another machine
      # (stop the pitwall container first: two controllers on one server conflict).
      - "${TM_XMLRPC_BIND:-127.0.0.1}:5000:5000/tcp"
    environment:
      TM_MASTERSERVER_LOGIN: ${TM_MASTERSERVER_LOGIN:?set TM_MASTERSERVER_LOGIN}
      TM_MASTERSERVER_PASSWORD: ${TM_MASTERSERVER_PASSWORD:?set TM_MASTERSERVER_PASSWORD}
      TM_AUTHORIZATION_SUPERADMIN_PASSWORD: ${TM_AUTHORIZATION_SUPERADMIN_PASSWORD:?set TM_AUTHORIZATION_SUPERADMIN_PASSWORD}
      TM_AUTHORIZATION_ADMIN_PASSWORD: ${TM_AUTHORIZATION_ADMIN_PASSWORD:?set TM_AUTHORIZATION_ADMIN_PASSWORD}
      TM_AUTHORIZATION_USER_PASSWORD: ${TM_AUTHORIZATION_USER_PASSWORD:?set TM_AUTHORIZATION_USER_PASSWORD}
      TM_SERVER_NAME: ${TM_SERVER_NAME:-PitWall}
      TM_SERVER_COMMENT: ${TM_SERVER_COMMENT:-}
      TM_SERVER_PASSWORD: ${TM_SERVER_PASSWORD:-}
      TM_SERVER_MAX_PLAYERS: ${TM_SERVER_MAX_PLAYERS:-16}
      TM_SERVER_MAX_SPECTATORS: ${TM_SERVER_MAX_SPECTATORS:-16}
      TM_SERVER_KEEP_PLAYER_SLOTS: "True"
      TM_SYSTEM_XMLRPC_ALLOWREMOTE: "True"
      # Public IP:port announced to players (needed behind Docker NAT), e.g. 203.0.113.10:2350
      TM_SYSTEM_FORCE_IP_ADDRESS: ${TM_SYSTEM_FORCE_IP_ADDRESS:-}
      # MatchSettings the server starts with; PitWall saves the playlist and the mode in it.
      TM_GAME_SETTINGS: ${TM_GAME_SETTINGS:-default.txt}
    volumes:
      - tm-userdata:/server/UserData

  pitwall:
    image: ghcr.io/maksiime/pitwall:latest
    container_name: pitwall
    restart: unless-stopped
    depends_on:
      - trackmania
    stdin_open: true   # Portainer → container → Attach gives the PitWall console
    tty: true
    environment:
      PITWALL_SERVER__HOST: trackmania
      PITWALL_SERVER__PORT: "5000"
      PITWALL_SERVER__PASSWORD: ${TM_AUTHORIZATION_SUPERADMIN_PASSWORD:?set TM_AUTHORIZATION_SUPERADMIN_PASSWORD}
      PITWALL_SERVER__PLAYLIST_FILE: MatchSettings/${TM_GAME_SETTINGS:-default.txt}
      # Maps are written straight into the server's volume (WriteFile is limited to ~3 MB).
      PITWALL_SERVER__MAPS_PATH: /tm-userdata/Maps
      PITWALL_CONTROLLER__DEFAULT_LANG: ${PITWALL_DEFAULT_LANG:-fr}
      PITWALL_CONTROLLER__DATA_DIR: /data
      PITWALL_CONTROLLER__MAPS_DIR: /data/maps
      # Trackmania logins, e.g. ["X6N6WxRIR_Sj6Xr10yuDJA"]
      PITWALL_ROLES__SUPERADMINS: ${PITWALL_SUPERADMINS:-[]}
      PITWALL_ROLES__ADMINS: ${PITWALL_ADMINS:-[]}
      PITWALL_ROLES__REFEREES: ${PITWALL_REFEREES:-[]}
      PITWALL_ROLES__CASTERS: ${PITWALL_CASTERS:-[]}
      # true: every player may add maps (/map add|tmx|uid|search).
      PITWALL_PLUGINS__MAPS__PLAYERS_CAN_ADD: ${PITWALL_PLAYERS_CAN_ADD_MAPS:-false}
      PITWALL_API__BIND: 0.0.0.0:8080
      PITWALL_API__ADMIN_TOKEN: ${PITWALL_API_ADMIN_TOKEN:-}
      PITWALL_API__PUBLIC_URL: ${PITWALL_API_PUBLIC_URL:-}
      PITWALL_NADEO__LOGIN: ${TM_MASTERSERVER_LOGIN}
      PITWALL_NADEO__PASSWORD: ${TM_MASTERSERVER_PASSWORD}
      # Optional: names of the world records (OAuth application from api.trackmania.com/manager).
      PITWALL_TRACKMANIA_API__CLIENT_ID: ${PITWALL_TM_API_CLIENT_ID:-}
      PITWALL_TRACKMANIA_API__CLIENT_SECRET: ${PITWALL_TM_API_CLIENT_SECRET:-}
      PITWALL_DISCORD__WEBHOOK_URL: ${PITWALL_DISCORD_WEBHOOK_URL:-}
      # Every bus event (checkpoints, respawns…) is logged at info by the logger plugin: hidden
      # by default on the server, "info" shows them again.
      PITWALL_LOG__FILTER: ${PITWALL_LOG_FILTER:-info,pitwall::events=warn}
    ports:
      # Web dashboard: private address only (Tailscale IP or 127.0.0.1).
      - "${PITWALL_WEB_BIND:-127.0.0.1}:8080:8080"
    volumes:
      - pitwall-data:/data
      - tm-userdata:/tm-userdata

volumes:
  tm-userdata:
  pitwall-data:
